[build-system]
requires = [
    "hatchling>=1.27",  # PEP 639: license = "<SPDX>" with license-files
]
build-backend = "hatchling.build"

[project]
name = "pubcheck"
version = "0.0.1"
description = "One publication check for every writer: is this text fit for a public repository? Personal names, the owner's own matters, private references, credentials and @mentions, failing closed when nobody is watching."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["privacy", "github", "publication", "guard", "agents", "claude-code"]
authors = [
    { name = "Thor Whalen" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openloops",  # egress.find_credentials: the one credential-pattern table
]

[project.urls]
Homepage = "https://github.com/thorwhalen/pubcheck"
Repository = "https://github.com/thorwhalen/pubcheck"
Documentation = "https://thorwhalen.github.io/pubcheck"
Issues = "https://github.com/thorwhalen/pubcheck/issues"

[project.scripts]
public-text-guard = "pubcheck.__main__:main"
pubcheck = "pubcheck.__main__:main"

[project.optional-dependencies]
correspond = ["correspond"]  # pubcheck.correspond, the before_send adapter (imported only there)
dev = [
    "correspond",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["pubcheck"]

[tool.hatch.build.targets.sdist]
only-include = ["pubcheck", "tests", ".github", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 90
target-version = "py310"
exclude = ["**/*.ipynb", ".git", ".venv", "build", "dist", "tests"]

[tool.ruff.lint]
select = ["D100"]
ignore = ["D203", "E501", "B905"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests", "pubcheck"]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = "pubcheck"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

# The correspond adapter's tests need correspond.
[tool.wads.ci.install]
extras = "correspond"

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
exclude_paths = ["examples", "scrap"]
# POSIX only: file modes, the system dictionary, `gh` and `acquaint` as subprocesses.
test_on_windows = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = ["tests/", "scrap/", "examples/"]
